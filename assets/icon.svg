<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title>StatusBarSecondRow App Icon</title>
  <desc>A professional macOS-style icon showing a compact second status bar row.</desc>
  <defs>
    <linearGradient id="bg" x1="180" y1="120" x2="860" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="0.48" stop-color="#243047"/>
      <stop offset="1" stop-color="#0D1324"/>
    </linearGradient>
    <linearGradient id="bar" x1="212" y1="330" x2="812" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDF5FF"/>
      <stop offset="1" stop-color="#C7D7E8"/>
    </linearGradient>
    <linearGradient id="accent" x1="228" y1="540" x2="796" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#48D6C7"/>
      <stop offset="0.55" stop-color="#65A8FF"/>
      <stop offset="1" stop-color="#8D7CFF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="accentGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#65A8FF" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="96" y="96" width="832" height="832" rx="188" fill="url(#bg)" filter="url(#softShadow)"/>
  <rect x="132" y="132" width="760" height="760" rx="154" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="5"/>

  <g>
    <rect x="212" y="292" width="600" height="96" rx="48" fill="url(#bar)" opacity="0.94"/>
    <circle cx="276" cy="340" r="20" fill="#1A2438" opacity="0.88"/>
    <circle cx="346" cy="340" r="20" fill="#1A2438" opacity="0.42"/>
    <circle cx="416" cy="340" r="20" fill="#1A2438" opacity="0.42"/>
    <rect x="486" y="320" width="242" height="40" rx="20" fill="#1A2438" opacity="0.18"/>

    <rect x="228" y="488" width="568" height="104" rx="52" fill="url(#accent)" filter="url(#accentGlow)"/>
    <circle cx="296" cy="540" r="24" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="376" cy="540" r="24" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="456" cy="540" r="24" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="536" cy="540" r="24" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="616" cy="540" r="24" fill="#FFFFFF" opacity="0.8"/>
    <rect x="694" y="516" width="48" height="48" rx="14" fill="#FFFFFF" opacity="0.9"/>

    <path d="M322 700H702" fill="none" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="36" stroke-linecap="round"/>
    <path d="M404 772H620" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
