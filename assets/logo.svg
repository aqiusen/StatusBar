<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title>StatusBarSecondRow Logo</title>
  <desc>Open-source logo for a macOS second status bar utility.</desc>
  <defs>
    <linearGradient id="markBg" x1="42" y1="40" x2="278" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="0.52" stop-color="#26334C"/>
      <stop offset="1" stop-color="#0D1324"/>
    </linearGradient>
    <linearGradient id="markAccent" x1="82" y1="188" x2="256" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#48D6C7"/>
      <stop offset="0.56" stop-color="#65A8FF"/>
      <stop offset="1" stop-color="#8D7CFF"/>
    </linearGradient>
    <linearGradient id="wordAccent" x1="486" y1="234" x2="784" y2="234" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28BFB4"/>
      <stop offset="1" stop-color="#5E8DFF"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0D1324" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1440" height="360" rx="0" fill="none"/>

  <g filter="url(#logoShadow)">
    <rect x="48" y="42" width="276" height="276" rx="72" fill="url(#markBg)"/>
    <rect x="72" y="92" width="228" height="52" rx="26" fill="#EEF5FF" opacity="0.94"/>
    <circle cx="108" cy="118" r="10" fill="#172033" opacity="0.86"/>
    <circle cx="144" cy="118" r="10" fill="#172033" opacity="0.42"/>
    <rect x="182" y="106" width="84" height="24" rx="12" fill="#172033" opacity="0.18"/>
    <rect x="82" y="172" width="208" height="56" rx="28" fill="url(#markAccent)"/>
    <circle cx="116" cy="200" r="12" fill="#FFFFFF" opacity="0.96"/>
    <circle cx="156" cy="200" r="12" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="196" cy="200" r="12" fill="#FFFFFF" opacity="0.8"/>
    <rect x="236" y="188" width="24" height="24" rx="7" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <g fill="#152033">
    <text x="388" y="174" font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="72" font-weight="760" letter-spacing="0">StatusBar</text>
    <text x="388" y="252" font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="72" font-weight="760" letter-spacing="0" fill="url(#wordAccent)">SecondRow</text>
    <text x="390" y="296" font-family="Inter, SF Pro Text, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="0" fill="#526175">A compact second line for crowded macOS menu bars.</text>
  </g>
</svg>
